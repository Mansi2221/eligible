[project]
name = "eligible"
version = "0.0.1"
description = "Patient-to-trial matching on harmonized clinical data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",          # DeepSeek is OpenAI-compatible
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Installed per layer to keep the base slim.
harmonize = ["duckdb>=1.1", "dbt-duckdb>=1.9", "pandas>=2.2", "requests>=2.31"]
harmonize-prod = ["pyspark>=3.5", "dbt-postgres>=1.7", "psycopg2-binary>=2.9"]
matching = ["langgraph>=0.2", "pinecone>=9.0"]
redaction = ["spacy>=3.7", "medspacy>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-jose[cryptography]>=3.3"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eligible*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
